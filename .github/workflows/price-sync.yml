name: Price Synchronization

on:
  schedule:
    # Runs every 75 minutes (roughly 19 times/day) to stay under 2,000 mins/month
    - cron: "0 0,5,10,15,20 * * *" # 12:00 AM, 5:00 AM, etc. (Wait, let's do a simpler offset)
    - cron: "15 1,6,11,16,21 * * *"
    - cron: "30 2,7,12,17,22 * * *"
    - cron: "45 3,8,13,18,23 * * *"

  workflow_dispatch:

jobs:
  sync:
    name: Update Prices & Enrich
    runs-on: ubuntu-latest

    env:
      KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_PATH: ${{ secrets.TURSO_DATABASE_URL }}
      NODE_ENV: "production"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: 💰 Update Prices
        run: bun run update-prices

      - name: 💎 Enrich Products
        continue-on-error: true
        run: bun run scripts/enrich-products.ts

      - name: ✨ Done
        run: echo "Price synchronization complete!"
