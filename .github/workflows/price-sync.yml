name: Price Synchronization

on:
  # DISABLED UNTIL TURSO QUOTA RESET (01.02.2026)
  # schedule:
  #   - cron: "0 * * * *" # Hourly
  workflow_dispatch:

jobs:
  sync:
    name: Update Prices & Enrich
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Writes go directly to Turso Cloud (Source of Truth)
      DB_REMOTE: "1"
      NODE_ENV: "production"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: 💰 Update Prices
        run: bun run update-prices

      - name: 💎 Enrich Products
        continue-on-error: true
        run: bun run worker:enrich de --limit=100

      - name: ✨ Done
        run: echo "Price synchronization complete!"
