name: Price Synchronization

on:
  schedule:
    # Run hourly to prevent token cap (drains in 1h).
    # Cost: 24 runs/day * 2 mins (rounded) = 48 mins/day.
    # Total: 48m + WarmCache(6m) = 54m/day * 31 ≈ 1674 mins/month (Safe)
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  sync:
    name: Update Prices & Enrich
    runs-on: ubuntu-latest

    env:
      KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_PATH: ${{ secrets.TURSO_DATABASE_URL }}
      NODE_ENV: "production"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: 💰 Update Prices
        run: bun run update-prices

      - name: 💎 Enrich Products
        continue-on-error: true
        run: bun run scripts/enrich-products.ts

      - name: ✨ Done
        run: echo "Price synchronization complete!"
