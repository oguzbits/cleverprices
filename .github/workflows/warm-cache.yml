name: Cache Warming

# on:
#   schedule:
#     # Runs every 12 hours (at 04:00 and 16:00 UTC)
#     # Reduced frequency to save GitHub Action minutes
#     - cron: "0 */4 * * *" # Runs every 4 hours (6 times/day)
on:
  workflow_dispatch:

jobs:
  warm:
    name: Warm Vercel Cache
    runs-on: ubuntu-latest

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_PATH: ${{ secrets.TURSO_DATABASE_URL }}
      NODE_ENV: "production"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔥 Warm Vercel Cache
        run: bun run warm-cache

      - name: ✨ Done
        run: echo "Cache warming cycle complete!"
